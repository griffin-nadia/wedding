<!doctype html>
<html lang="en" data-theme="autumn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content" />
    <!-- Private site: keep it out of search engines -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3e7d3" />
    <script>
      // Lantern mode: pick the theme before first paint so there's no flash.
      // A saved choice wins; otherwise follow the device's light or dark setting.
      (function () {
        var saved = null
        try { saved = localStorage.getItem("ng-theme") } catch (e) {}
        var dark = saved ? saved === "lantern" : window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches
        document.documentElement.setAttribute("data-theme", dark ? "lantern" : "autumn")
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#22160e" : "#f3e7d3")
        // Their photo is the largest paint on every page: start fetching this mode's one now, not after the app script
        var l = document.createElement("link"), n = dark ? "night-lane" : "kyoto-view", b = "%BASE_URL%scenes/" + n + "-"
        l.rel = "preload"; l.as = "image"; l.type = "image/avif"; l.setAttribute("fetchpriority", "high")
        l.setAttribute("imagesrcset", b + "800.avif 800w, " + b + "1200.avif 1200w, " + b + "1600.avif 1600w"); l.setAttribute("imagesizes", "100vw")
        document.head.appendChild(l)
        window.__ngScene = { n: n, b: b }
      })()
    </script>
    <meta property="og:title" content="Nadia & Griffin · Kyoto, 15 October 2027" />
    <meta property="og:description" content="You're invited." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://griffin-nadia.github.io/wedding/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nadia & Griffin, 15 October 2027, Kyoto" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="description" content="Nadia & Griffin's wedding, Fri 15 Oct 2027, The Sodoh Higashiyama, Kyoto." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Nadia & Griffin</title>
  </head>
  <body>
    <!-- Phones: their photo paints straight from HTML, the same markup as the app's scene; the app removes this
         once its own copy has loaded, so the largest paint doesn't wait for the app script. -->
    <div id="scene-shell" class="scene fixed inset-0 -z-10 overflow-hidden" aria-hidden="true" hidden></div>
    <div id="scene-shell-band" class="scene scene-band fixed inset-0 -z-10 overflow-hidden" aria-hidden="true" hidden></div>
    <script>
      (function () {
        var s = window.__ngScene, el = document.getElementById("scene-shell")
        if (!s || !el || innerWidth >= 1024) { document.getElementById("scene-shell-band").remove(); return el && el.remove() }
        var band = document.getElementById("scene-shell-band")
        if (location.pathname.replace(/\/+$/, "").endsWith("/wedding") && !localStorage.getItem("ng-opened")) band.remove() // sealed envelope: no dock yet
        el.innerHTML = '<div class="scene-layer absolute inset-0"><picture class="scene-photo absolute inset-0"><source type="image/avif" sizes="100vw" srcset="' + s.b + '800.avif 800w, ' + s.b + '1200.avif 1200w, ' + s.b + '1600.avif 1600w"><img alt="" class="size-full object-cover" fetchpriority="high" src="' + s.b + '1600.webp"></picture></div>'
        el.hidden = false
        if (band.isConnected) { band.innerHTML = el.innerHTML; band.hidden = false }
      })()
    </script>
    <!-- First visit to Home: the sealed envelope paints straight from HTML and CSS, before the app script.
         The app takes over the same envelope on load and removes this shell. -->
    <div id="arrival-shell" class="arrival" aria-hidden="true" hidden>
      <span class="envelope paper"><span class="envelope-back"></span><span class="envelope-paper"></span><span class="envelope-front"></span><span class="envelope-flap"></span><span class="envelope-seal"><img src="%BASE_URL%brand/seal.svg" alt="" width="64" height="64" class="shrink-0 size-full"></span></span>
    </div>
    <script>
      (function () {
        try {
          var home = /\/wedding\/?$/.test(location.pathname)
          var seen = localStorage.getItem("ng-opened")
          var still = matchMedia("(prefers-reduced-motion: reduce)").matches
          var rsvp = new URLSearchParams(location.search).get("rsvp") === "1"
          var noren = /"arrival":"noren"/.test(localStorage.getItem("ng-tune") || "")
          if (home && !seen && !still && !rsvp && !noren) document.getElementById("arrival-shell").hidden = false
        } catch (e) {}
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
