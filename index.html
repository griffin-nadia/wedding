<!doctype html>
<html lang="en" data-theme="autumn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content" />
    <!-- Private site: keep it out of search engines -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3e7d3" />
    <script>
      // Lantern mode: pick the theme before first paint so there's no flash.
      // Day (autumn) is the default and night (Lantern) the switch (run 26): only a saved choice of Lantern opens dark.
      (function () {
        var saved = null
        try { saved = localStorage.getItem("ng-theme") } catch (e) {}
        var dark = saved === "lantern"
        document.documentElement.setAttribute("data-theme", dark ? "lantern" : "autumn")
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#2e1b12" : "#f3e7d3")
        // Their photo is the largest paint on every page: start fetching this mode's one now, not after the app script.
        // Run 27 (P1): except Our story, whose largest paint is the opener's two kid prints: those first (the same srcset
        // and sizes as their AVIF source, our-story.tsx OPENER_SIZES, so the same file)
        var story = /\/our-story\/?$/.test(location.pathname)
        if (story) ["kid-nadia-home", "kid-griffin"].forEach(function (k) {
          var o = document.createElement("link"), ob = "%BASE_URL%photos/" + k + "-"
          o.rel = "preload"; o.as = "image"; o.type = "image/avif"; o.setAttribute("fetchpriority", "high")
          o.setAttribute("imagesrcset", ob + "400.avif 400w, " + ob + "800.avif 800w"); o.setAttribute("imagesizes", "(min-width: 1024px) 260px, 56vw")
          document.head.appendChild(o)
        })
        var n = dark ? "night-lane" : "kyoto-view"
        try { var po = (JSON.parse(localStorage.getItem("ng-tune") || "{}").options || {}).photo; if (po === "day") n = "kyoto-view"; else if (po === "night") n = "night-lane" } catch (e) {}
        var l = document.createElement("link"), b = "%BASE_URL%scenes/" + n + "-"
        l.rel = "preload"; l.as = "image"; l.type = "image/avif"; l.setAttribute("fetchpriority", "high")
        if (innerWidth >= 1280) { l.setAttribute("imagesrcset", b + "wide-1600.avif 1600w, " + b + "wide-2400.avif 2400w"); l.setAttribute("imagesizes", "100vw") }
        else { l.setAttribute("imagesrcset", b + "800.avif 800w, " + b + "1200.avif 1200w, " + b + "1600.avif 1600w, " + b + "2000.avif 2000w, " + b + "2400.avif 2400w"); l.setAttribute("imagesizes", "max(100vw, 75vh)") }
        document.head.appendChild(l)
        window.__ngScene = { n: n, b: b }
        // The paper (run 26): a sheet exported ahead at the size this screen shows it (scripts/paper-export.mjs,
        // src/lib/paper-sheet.ts), asked for now so it arrives with the page. Off under Save-Data, and in automated
        // browsers unless a test asks for it (ng-paper=on), so the screenshot tests stay as they are.
        var pOn = !(navigator.connection && navigator.connection.saveData)
        try { if (navigator.webdriver && localStorage.getItem("ng-paper") !== "on") pOn = false } catch (e) { if (navigator.webdriver) pOn = false }
        var pAt = function (night) {
          var land = innerWidth > innerHeight, px = innerWidth * Math.min(3, devicePixelRatio || 1)
          return "%BASE_URL%paper/paper-" + (night ? "lantern" : "autumn") + "-" + (land ? (px > 1600 ? "l2400" : "l1600") : (px > 800 ? "p1200" : "p800")) + ".avif"
        }
        window.__ngPaper = { on: pOn, at: pAt, done: function () {} }
        if (pOn) { var pl = document.createElement("link"); pl.rel = "preload"; pl.as = "image"; pl.type = "image/avif"; pl.href = pAt(dark); document.head.appendChild(pl) }
        // The day (run 22): Nadia's Sodoh lettering is that page's largest paint, so its small mask starts now too
        if (/\/the-day\/?$/.test(location.pathname)) {
          var v = document.createElement("link"); v.rel = "preload"; v.as = "image"; v.type = "image/webp"; v.crossOrigin = "anonymous"; v.setAttribute("fetchpriority", "high") // masks load in CORS mode
          v.href = "%BASE_URL%art/sodoh/sodoh-mask-" + (devicePixelRatio > 1 ? 560 : 280) + ".webp"; document.head.appendChild(v)
        }
      })()
    </script>
    <script>
      // The safety net against a blank page (run 19). If the app's script, or a piece of it, fails to load (most often
      // an old copy of this page asking for files a newer deploy replaced), load the page again once, past the cache:
      // never twice within a minute, so never a loop. If that can't help, or the app breaks while it runs, a plain
      // paper card says so, with a Refresh button (no email address on the site, run 26). Plain HTML here, so it works with nothing else loaded.
      (function () {
        window.__ngReload = function () {
          if (window.__ngReloading) return true
          var u = new URL(location.href), now = Date.now(), last = 0
          try { last = +sessionStorage.getItem("ng-reloaded") || 0; sessionStorage.setItem("ng-reloaded", String(now)) }
          catch (e) { last = u.searchParams.has("fresh") ? now : 0 } // storage blocked: the address remembers instead
          if (now - last < 60000) return false
          u.searchParams.set("fresh", now.toString(36))
          window.__ngReloading = true
          location.replace(u.href)
          return true
        }
        window.__ngCrash = function () {
          if (!document.body) return addEventListener("DOMContentLoaded", window.__ngCrash, { once: true })
          if (document.getElementById("crash")) return
          var ja = false
          try { ja = localStorage.getItem("ng-lang") === "ja" } catch (e) {}
          var night = document.documentElement.getAttribute("data-theme") === "lantern"
          var bg = night ? "#2e1b12" : "#f3e7d3", ink = night ? "#f3e7d3" : "#421a05"
          var c = ja
            ? ["問題が発生しました。ページを再読み込みしてください。", "それでも直らないときは、少し時間をおいてもう一度お試しください。", "再読み込み"]
            : ["Something went wrong, try refreshing", "If it keeps happening, try again a little later.", "Refresh"]
          var tap = "display:inline-flex;align-items:center;min-height:44px;font:inherit;"
          var d = document.createElement("div")
          d.id = "crash"
          d.setAttribute("style", "position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:16px;overflow:auto;background:var(--surface-paper," + bg + ");color:var(--ink," + ink + ");font:17px/1.5 Inter,system-ui,sans-serif")
          d.innerHTML = '<main lang="' + (ja ? "ja" : "en") + '" style="box-sizing:border-box;width:100%;max-width:26rem;padding:32px 24px;border:1px solid currentColor;border-radius:6px">'
            + '<h1 tabindex="-1" style="margin:0 0 12px;font:400 1.6rem/1.25 Oranienbaum,\'Zen Old Mincho\',Georgia,serif;outline:none">' + c[0] + '</h1>'
            + '<p style="margin:0 0 24px">' + c[1] + '</p>'
            + '<div style="display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center">'
            + '<button type="button" style="' + tap + 'padding:0 20px;border:0;border-radius:999px;cursor:pointer;background:var(--action,' + ink + ');color:var(--action-ink,' + bg + ')">' + c[2] + '</button>'
            + '</div></main>'
          d.querySelector("button").onclick = function () { var u = new URL(location.href); u.searchParams.set("fresh", Date.now().toString(36)); location.replace(u.href) }
          document.body.appendChild(d)
          d.querySelector("h1").focus()
        }
        // The app's own script, or a file it needs, failed before it started (after that, the app reports its own)
        addEventListener("error", function (e) {
          var t = e.target
          if (window.__ngBooted || !t || t.tagName !== "SCRIPT" && !(t.tagName === "LINK" && t.rel === "modulepreload")) return
          if (!window.__ngReload()) window.__ngCrash()
        }, true)
      })()
    </script>
    <!-- Paper behind everything from the first paint, in the mode just picked: never a white frame -->
    <style>html{background:#f3e7d3}html[data-theme="lantern"]{background:#2e1b12;color-scheme:dark}</style>
    <style>
      #paper-veil{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#f3e7d3;transition:opacity 300ms ease-out}
      html[data-theme="lantern"] #paper-veil{background:#2e1b12}
      #paper-veil[hidden]{display:none}
      #paper-veil[data-gone]{opacity:0;pointer-events:none}
      #paper-veil img{opacity:.5;animation:paper-veil 1.2s ease-in-out infinite alternate}
      @keyframes paper-veil{to{opacity:.85;transform:scale(1.04)}}
      @media (prefers-reduced-motion:reduce){#paper-veil{transition-duration:250ms}#paper-veil img{animation:none;opacity:.7}}
    </style>
    <meta property="og:title" content="Griffin & Nadia · Kyoto, 15 October 2027" />
    <meta property="og:description" content="You're invited." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Griffin & Nadia, 15 October 2027, Kyoto" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="description" content="Griffin & Nadia's wedding, Fri 15 Oct 2027, The Sodoh Higashiyama, Kyoto." />
    <!-- Nadia's wax seal (scripts/favicon.mjs): 16, 32 and 48 in the .ico, a large PNG for sharp screens -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Griffin & Nadia</title>
  </head>
  <body>
    <!-- Phones: their photo paints straight from HTML, the same markup as the app's scene; the app removes this
         once its own copy has loaded, so the largest paint doesn't wait for the app script. -->
    <!-- The hanko's ink bleeding a little into the paper: a soft ragged edge (src/index.css, .hanko) -->
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <filter id="ink-bleed" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="4" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G" result="d" />
        <feGaussianBlur in="d" stdDeviation="0.45" result="soft" />
        <feMerge><feMergeNode in="soft" /><feMergeNode in="d" /></feMerge>
      </filter>
    </svg>
    <div id="scene-shell" class="scene fixed inset-0 -z-10 overflow-hidden" aria-hidden="true" hidden></div>
    <div id="scene-shell-band" class="scene scene-band fixed inset-0 -z-10 overflow-hidden" aria-hidden="true" hidden></div>
    <script>
      (function () {
        var s = window.__ngScene, el = document.getElementById("scene-shell")
        if (!s || !el || innerWidth >= 1024) { document.getElementById("scene-shell-band").remove(); return el && el.remove() }
        var band = document.getElementById("scene-shell-band")
        if (location.pathname.replace(/\/+$/, "").endsWith("/wedding") && !(function () { try { return localStorage.getItem("ng-opened") } catch (e) { return "1" } })()) band.remove() // sealed envelope: no dock yet
        el.innerHTML = '<div class="scene-layer absolute inset-0"><picture class="scene-photo absolute inset-0"><source type="image/avif" sizes="max(100vw, 75vh)" srcset="' + s.b + '800.avif 800w, ' + s.b + '1200.avif 1200w, ' + s.b + '1600.avif 1600w, ' + s.b + '2000.avif 2000w, ' + s.b + '2400.avif 2400w"><img alt="" class="size-full object-cover" fetchpriority="high" src="' + s.b + '1600.webp"></picture></div>'
        el.hidden = false
        if (band.isConnected) { band.innerHTML = el.innerHTML; band.hidden = false }
      })()
    </script>
    <!-- First visit to Home: the sealed envelope paints straight from HTML and CSS, before the app script.
         The app takes over the same envelope on load and removes this shell. -->
    <div id="arrival-shell" class="arrival" aria-hidden="true" hidden>
      <span class="envelope paper"><span class="envelope-back"></span><span class="envelope-paper"></span><span class="envelope-front"></span><span class="envelope-flap"></span><span class="envelope-seal"><img src="%BASE_URL%brand/seal.svg" alt="" width="64" height="64" class="shrink-0 size-full"></span></span>
    </div>
    <script>
      (function () {
        try {
          var home = /\/wedding\/?$/.test(location.pathname)
          var seen = localStorage.getItem("ng-opened")
          var still = matchMedia("(prefers-reduced-motion: reduce)").matches
          var rsvp = new URLSearchParams(location.search).get("rsvp") === "1"
          var noren = /"arrival":"noren"/.test(localStorage.getItem("ng-tune") || "")
          // Sealed from the first paint (run 19): the bar has no paper over the photo, the photo is framed for the envelope
          if (home && !seen && !still && !rsvp) document.documentElement.setAttribute("data-sealed", "")
          if (home && !seen && !still && !rsvp && !noren) {
            document.getElementById("arrival-shell").hidden = false
            // Her sealed envelope is the first thing they see: fetch it now, not once the app has rendered. The same
            // srcset and sizes as the img's AVIF source (envelope.tsx), so it picks the same file (820 on phones)
            var e = document.createElement("link"), eb = "%BASE_URL%art/envelope/envelope-closed-"
            e.rel = "preload"; e.as = "image"; e.type = "image/avif"; e.setAttribute("fetchpriority", "high")
            e.setAttribute("imagesrcset", eb + "410.avif 410w, " + eb + "820.avif 820w"); e.setAttribute("imagesizes", "(min-width: 768px) 410px, 260px")
            document.head.appendChild(e)
          }
        } catch (e) {}
      })()
    </script>
    <!-- The paper's veil (run 26): on a first visit, plain paper and her seal over the page until the paper sheet is in
         (src/lib/paper-sheet.ts), so it never pops in halfway through; about 1.5 s once it shows, never past 2.5 s (run 26c). The seal breathes;
         under reduced motion it's still and the veil only fades (250 ms, opacity). Not over the sealed envelope. -->
    <div id="paper-veil" aria-hidden="true" hidden><img src="%BASE_URL%brand/seal.svg" alt="" width="56" height="56"></div>
    <script>
      (function () {
        var p = window.__ngPaper, v = document.getElementById("paper-veil"), seen = null
        try { seen = localStorage.getItem("ng-paper-seen") } catch (e) {}
        var src = p && p.on && p.at(document.documentElement.getAttribute("data-theme") === "lantern")
        var gone = function () { if (!v.isConnected) return; v.setAttribute("data-gone", ""); setTimeout(function () { v.remove() }, 350) }
        // Run 26c: about 1.5 s, so the paper is always in before the page shows: the veil goes once 1.5 s have passed
        // and the sheet is in, and at 2.5 s whatever happens (a slow connection never waits on it longer)
        var held = true, ready = false, maybe = function () { if (!held && ready) gone() }
        if (p) p.done = function (s, ok) { if (ok) { try { localStorage.setItem("ng-paper-seen", s) } catch (e) {} } ready = true; maybe() }
        if (!src || seen === src || document.documentElement.hasAttribute("data-sealed")) return v.remove()
        v.hidden = false
        // Timed from the veil's first paint (two frames on), not from here: on a slow phone the first paint is seconds
        // after this runs, and the veil would be gone before it was ever seen
        requestAnimationFrame(function () { requestAnimationFrame(function () { setTimeout(function () { held = false; maybe() }, 1500); setTimeout(gone, 2500) }) })
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
